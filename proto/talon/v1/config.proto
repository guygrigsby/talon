syntax = "proto3";

package talon.v1;

option go_package = "github.com/guygrigsby/talon/internal/api/v1/talon/v1;talonv1";

import "talon/v1/common.proto";

// ConfigService surfaces Talon's config and cached config schema, plus
// write access against native config.
service ConfigService {
  // Get returns the value at the requested dotted path, or the
  // whole merged config when path is empty.
  rpc Get(ConfigGetRequest) returns (JSONPayload);
  // Schema returns the cached config JSON schema (refreshed via
  // `talon config schema --refresh` on the CLI side).
  rpc Schema(ConfigSchemaRequest) returns (JSONPayload);
  // Set writes value_json at path into native config. Empty value_json
  // deletes the path.
  rpc Set(ConfigSetRequest) returns (JSONPayload);
}

message ConfigGetRequest {
  string path = 1;
}

message ConfigSchemaRequest {
  // Section filters the returned schema to one subschema
  // (dotted; drill via "gateway.auth"). Empty returns the
  // whole schema.
  string section = 1;
}

message ConfigSetRequest {
  // Path is the dotted target (e.g. "agents.defaults.models.openai/gpt-4o.alias").
  string path = 1;
  // ValueJson is the JSON-encoded value to write. Empty deletes
  // the path. Parsed server-side, so an empty string means
  // "delete" — to write the string "" pass "\"\"".
  string value_json = 2;
  // Merge controls how object/array values merge into existing
  // ones. When false (default), the value replaces; when true,
  // objects deep-merge and id-keyed arrays merge by id.
  bool merge = 3;
}
