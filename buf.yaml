version: v2
# Talon's first-party API protos. Distinct from the plugin protocol
# in internal/plugin/proto/ — that ships standalone (talon-plugin
# protocol consumed by go-plugin), this is the gateway's outward-
# facing RPC surface that the web frontend + any future Go SDK
# consumes via Connect (HTTP/JSON in browsers, gRPC wire elsewhere).
modules:
  - path: proto
    name: buf.build/guygrigsby/talon
lint:
  use:
    - STANDARD
  except:
    # Talon's API methods are named to match the existing JSON-RPC
    # surface (chat.send -> Send under ChatService). The STANDARD
    # rule wants RPC names to be Verb+Noun ("SendChat") which would
    # break the 1:1 mapping callers expect during the migration.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
