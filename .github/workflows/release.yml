name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make cross
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/talon-linux-amd64
            bin/talon-linux-arm64
            bin/talon-darwin-amd64
            bin/talon-darwin-arm64
            bin/talon-windows-amd64.exe
