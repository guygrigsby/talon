name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # web/build/.gitkeep is committed, so the //go:embed in web/embed.go
      # resolves without a UI build — golangci-lint can compile the tree.
      - name: install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
      - name: golangci-lint run
        run: "$(go env GOPATH)/bin/golangci-lint run ./..."
