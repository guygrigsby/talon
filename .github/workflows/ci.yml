name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make vet

  web:
    # Frontend type-check + tests. The test runner is vitest in browser
    # mode (headless Chromium via Playwright), so the browser is installed
    # with its system deps before the run.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check
      - run: pnpm run test

  proto:
    # Guards the FE contract under proto/talon/v1. lint catches
    # style drift; breaking catches accidental field removals,
    # type changes, and number renumbers that would silently
    # invalidate the frontend's generated TS types. talon-y6v
    # split the WS surface into typed Connect services; this job
    # is the policy gate that keeps the split honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Breaking-change detection needs the comparison ref locally:
          # HEAD~1 on direct-to-main pushes; origin/main on PRs. depth: 2
          # covers HEAD~1 but not origin/main, so buf would fail on PRs
          # with "couldn't find remote ref origin/main". 0 fetches full
          # history so both modes work.
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: buf lint
        run: buf lint
      - name: buf breaking (vs HEAD~1 on push, vs main on PR)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            buf breaking --against '.git#branch=origin/main'
          else
            # First commit edge case: HEAD~1 may not exist on a
            # brand-new repo. Skip cleanly instead of failing the
            # whole job — only matters until the first proto edit
            # lands after this workflow goes live.
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              buf breaking --against '.git#ref=HEAD~1'
            else
              echo "no HEAD~1 yet; skipping breaking check"
            fi
          fi
